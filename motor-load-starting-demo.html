<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电机带载启动演示系统</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
        }

        .control-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .control-panel h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #34495e;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .btn-success {
            background: linear-gradient(135deg, #27ae60, #229954);
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(39, 174, 96, 0.4);
        }

        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }

        .btn-warning:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
        }

        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4);
        }

        .status-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .status-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .status-item h3 {
            color: #2c3e50;
            font-size: 0.9em;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .status-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #34495e;
        }

        .status-unit {
            font-size: 0.8em;
            color: #7f8c8d;
        }

        .chart-container {
            grid-column: 1 / -1;
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .chart-container h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .log-panel {
            grid-column: 1 / -1;
            background: #2c3e50;
            color: #ecf0f1;
            border-radius: 10px;
            padding: 20px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 5px 0;
            border-bottom: 1px solid #34495e;
        }

        .log-time {
            color: #95a5a6;
            font-size: 0.8em;
        }

        .log-message {
            color: #ecf0f1;
        }

        .log-warning {
            color: #f39c12;
        }

        .log-error {
            color: #e74c3c;
        }

        .log-success {
            color: #27ae60;
        }

        .motor-indicator {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }

        .motor-symbol {
            width: 80px;
            height: 80px;
            border: 4px solid #34495e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            transition: all 0.3s ease;
            position: relative;
        }

        .motor-symbol.running {
            border-color: #27ae60;
            background: #27ae60;
            color: white;
            animation: rotate 2s linear infinite;
        }

        .motor-symbol.stopped {
            border-color: #e74c3c;
            background: #e74c3c;
            color: white;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .motor-status {
            margin-left: 20px;
            font-size: 1.2em;
            font-weight: bold;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #ecf0f1;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3498db, #27ae60);
            width: 0%;
            transition: width 0.3s ease;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .btn-group {
                grid-template-columns: 1fr;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 电机带载启动演示系统</h1>
            <p>Motor Load Starting Demonstration System</p>
        </div>

        <div class="content">
            <div class="control-panel">
                <h2>🎛️ 控制面板</h2>
                
                <div class="control-group">
                    <label>启动方式选择</label>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="startMotor('soft')">软启动</button>
                        <button class="btn btn-primary" onclick="startMotor('starDelta')">星三角启动</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="startMotor('autotransformer')">自耦变压器</button>
                        <button class="btn btn-warning" onclick="startMotor('direct')">直接启动</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>负载类型设置</label>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="setLoadType('constant')">恒转矩</button>
                        <button class="btn btn-success" onclick="setLoadType('variable')">变转矩</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-success" onclick="setLoadType('power')">恒功率</button>
                    </div>
                </div>

                <div class="control-group">
                    <label>操作控制</label>
                    <div class="btn-group">
                        <button class="btn btn-danger" onclick="stopMotor()">停止电机</button>
                        <button class="btn btn-warning" onclick="clearLog()">清除日志</button>
                    </div>
                </div>

                <div class="motor-indicator">
                    <div class="motor-symbol" id="motorSymbol">⚡</div>
                    <div class="motor-status" id="motorStatus">已停止</div>
                </div>

                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="status-panel">
                <h2>📊 实时状态</h2>
                
                <div class="status-grid">
                    <div class="status-item">
                        <h3>电压</h3>
                        <div class="status-value" id="voltageValue">0</div>
                        <div class="status-unit">V</div>
                    </div>
                    <div class="status-item">
                        <h3>电流</h3>
                        <div class="status-value" id="currentValue">0</div>
                        <div class="status-unit">A</div>
                    </div>
                    <div class="status-item">
                        <h3>转速</h3>
                        <div class="status-value" id="speedValue">0</div>
                        <div class="status-unit">rpm</div>
                    </div>
                    <div class="status-item">
                        <h3>转矩</h3>
                        <div class="status-value" id="torqueValue">0</div>
                        <div class="status-unit">N·m</div>
                    </div>
                    <div class="status-item">
                        <h3>温度</h3>
                        <div class="status-value" id="temperatureValue">25</div>
                        <div class="status-unit">°C</div>
                    </div>
                    <div class="status-item">
                        <h3>运行时间</h3>
                        <div class="status-value" id="runtimeValue">0</div>
                        <div class="status-unit">s</div>
                    </div>
                </div>
            </div>

            <div class="chart-container">
                <h2>📈 运行曲线</h2>
                <canvas id="motorChart" width="800" height="400"></canvas>
            </div>

            <div class="log-panel">
                <h3>📝 运行日志</h3>
                <div id="logContainer"></div>
            </div>
        </div>
    </div>

    <script src="script/motor-load-starting-demo.js"></script>
    <script>
        let demo;
        let chart;
        let chartData = {
            labels: [],
            voltage: [],
            current: [],
            speed: [],
            temperature: []
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            demo = new MotorLoadStartingDemo();
            initializeChart();
            addLog('系统初始化完成', 'success');
        });

        // 初始化图表
        function initializeChart() {
            const ctx = document.getElementById('motorChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: '电压 (V)',
                            data: [],
                            borderColor: '#3498db',
                            backgroundColor: 'rgba(52, 152, 219, 0.1)',
                            yAxisID: 'y'
                        },
                        {
                            label: '电流 (A)',
                            data: [],
                            borderColor: '#e74c3c',
                            backgroundColor: 'rgba(231, 76, 60, 0.1)',
                            yAxisID: 'y'
                        },
                        {
                            label: '转速 (rpm)',
                            data: [],
                            borderColor: '#27ae60',
                            backgroundColor: 'rgba(39, 174, 96, 0.1)',
                            yAxisID: 'y1'
                        },
                        {
                            label: '温度 (°C)',
                            data: [],
                            borderColor: '#f39c12',
                            backgroundColor: 'rgba(243, 156, 18, 0.1)',
                            yAxisID: 'y'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    scales: {
                        x: {
                            display: true,
                            title: {
                                display: true,
                                text: '时间 (s)'
                            }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: {
                                display: true,
                                text: '电压/电流/温度'
                            }
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: {
                                display: true,
                                text: '转速 (rpm)'
                            },
                            grid: {
                                drawOnChartArea: false,
                            },
                        }
                    },
                    plugins: {
                        title: {
                            display: true,
                            text: '电机运行参数实时曲线'
                        }
                    }
                }
            });
        }

        // 启动电机
        function startMotor(method) {
            if (demo.isRunning) {
                addLog('电机已在运行中', 'warning');
                return;
            }

            addLog(`开始${demo.getMethodName(method)}启动`, 'success');
            
            // 更新电机状态显示
            updateMotorStatus(true);
            
            // 启动电机
            demo.start(method);
            
            // 开始实时监控
            startMonitoring();
        }

        // 停止电机
        function stopMotor() {
            if (!demo.isRunning) {
                addLog('电机未在运行', 'warning');
                return;
            }

            addLog('停止电机', 'warning');
            demo.stop();
            updateMotorStatus(false);
        }

        // 设置负载类型
        function setLoadType(type) {
            demo.setLoadType(type);
            const typeNames = {
                'constant': '恒转矩',
                'variable': '变转矩',
                'power': '恒功率'
            };
            addLog(`负载类型设置为: ${typeNames[type]}`, 'success');
        }

        // 更新电机状态显示
        function updateMotorStatus(running) {
            const motorSymbol = document.getElementById('motorSymbol');
            const motorStatus = document.getElementById('motorStatus');
            
            if (running) {
                motorSymbol.className = 'motor-symbol running';
                motorSymbol.textContent = '⚡';
                motorStatus.textContent = '运行中';
            } else {
                motorSymbol.className = 'motor-symbol stopped';
                motorSymbol.textContent = '⏹️';
                motorStatus.textContent = '已停止';
            }
        }

        // 开始监控
        function startMonitoring() {
            const monitoringInterval = setInterval(() => {
                if (!demo.isRunning) {
                    clearInterval(monitoringInterval);
                    return;
                }

                // 更新状态显示
                updateStatusDisplay();
                
                // 更新图表
                updateChart();
                
                // 更新进度条
                updateProgressBar();
                
            }, 100);
        }

        // 更新状态显示
        function updateStatusDisplay() {
            document.getElementById('voltageValue').textContent = demo.monitoring.voltage.toFixed(1);
            document.getElementById('currentValue').textContent = demo.monitoring.current.toFixed(1);
            document.getElementById('speedValue').textContent = demo.monitoring.speed.toFixed(0);
            document.getElementById('torqueValue').textContent = demo.monitoring.torque.toFixed(1);
            document.getElementById('temperatureValue').textContent = demo.monitoring.temperature.toFixed(1);
            
            const runtime = demo.monitoring.startTime ? 
                ((Date.now() - demo.monitoring.startTime) / 1000).toFixed(1) : 0;
            document.getElementById('runtimeValue').textContent = runtime;
        }

        // 更新图表
        function updateChart() {
            const runtime = demo.monitoring.startTime ? 
                ((Date.now() - demo.monitoring.startTime) / 1000) : 0;
            
            // 限制数据点数量
            if (chartData.labels.length > 100) {
                chartData.labels.shift();
                chartData.voltage.shift();
                chartData.current.shift();
                chartData.speed.shift();
                chartData.temperature.shift();
            }
            
            chartData.labels.push(runtime.toFixed(1));
            chartData.voltage.push(demo.monitoring.voltage);
            chartData.current.push(demo.monitoring.current);
            chartData.speed.push(demo.monitoring.speed);
            chartData.temperature.push(demo.monitoring.temperature);
            
            chart.data.labels = chartData.labels;
            chart.data.datasets[0].data = chartData.voltage;
            chart.data.datasets[1].data = chartData.current;
            chart.data.datasets[2].data = chartData.speed;
            chart.data.datasets[3].data = chartData.temperature;
            
            chart.update('none');
        }

        // 更新进度条
        function updateProgressBar() {
            const progressFill = document.getElementById('progressFill');
            const speedRatio = demo.monitoring.speed / demo.motor.ratedSpeed;
            progressFill.style.width = (speedRatio * 100) + '%';
        }

        // 添加日志
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            
            const time = new Date().toLocaleTimeString();
            const className = type === 'warning' ? 'log-warning' : 
                            type === 'error' ? 'log-error' : 
                            type === 'success' ? 'log-success' : 'log-message';
            
            logEntry.innerHTML = `
                <span class="log-time">[${time}]</span>
                <span class="${className}">${message}</span>
            `;
            
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }

        // 清除日志
        function clearLog() {
            document.getElementById('logContainer').innerHTML = '';
            addLog('日志已清除', 'success');
        }

        // 重写console.log以捕获日志
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            const message = args.join(' ');
            if (message.includes('过流保护') || message.includes('过载保护') || message.includes('过温保护')) {
                addLog(message, 'error');
            } else if (message.includes('启动完成') || message.includes('设置')) {
                addLog(message, 'success');
            } else if (message.includes('警告') || message.includes('停止')) {
                addLog(message, 'warning');
            } else {
                addLog(message, 'info');
            }
        };
    </script>
</body>
</html>
